<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PREVIEW – Shepley Magazine</title>
<meta name="robots" content="noindex">
<meta name="description" content="Shepley Magazine – the free monthly magazine for every household in Shepley. Read the latest issue, browse by section, search every article and see what's on in the village.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script>window.SITE_BASE = '../'; window.SITE_PREVIEW = true;</script>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<header class="site">
  <div class="wrap">
    <div class="head-row">
      <a class="mast" href="#home">
        <div class="name">Shepley<small>Magazine</small></div>
        <div class="meta">Free to every<br>Shepley household</div>
      </a>
      <div class="head-tools">
        <button class="search-btn" id="openSearch" aria-label="Search the magazine">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="lbl">Search the magazine</span><kbd>/</kbd>
        </button>
        <button class="burger" id="burger" aria-label="Menu">☰</button>
      </div>
    </div>
    <nav class="main" id="nav" aria-label="Main">
      <a href="#home" data-r="home">Home</a>
      <a href="#latest-issue" data-r="latest-issue">Latest Issue</a>
      <div class="dd" id="dd">
        <button id="ddBtn" aria-expanded="false" aria-controls="ddPanel">Sections ▾</button>
        <div class="dd-panel" id="ddPanel"></div>
      </div>
      <a href="#whats-on" data-r="whats-on">What's On</a>
      <a href="#archive" data-r="archive">Back Issues</a>
      <a href="#contribute" data-r="contribute">Contribute</a>
    </nav>
  </div>
</header>

<main id="app"><div class="wrap" style="padding:80px 24px;font-family:Inter,sans-serif;color:#6b675e">Loading…</div></main>

<footer class="site" id="footer"></footer>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="sbox" role="dialog" aria-label="Search">
    <div class="top">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b675e" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search articles, clubs, events… e.g. bonfire, library, cricket" autocomplete="off" aria-label="Search">
      <button class="x" id="closeSearch">Esc</button>
    </div>
    <div class="sfilters" id="sfilters"></div>
    <div class="sresults" id="sresults"></div>
    <div class="shint">↑ ↓ to move · Enter to open · Searches every article and every page of every issue</div>
  </div>
</div>

<script src="assets/site.js"></script>
</body>
</html>
